name: Pull request checks

on:
  pull_request:
    branches:
      - master

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  website-test:
    name: Unit, component and server tests
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      VITE_GRAPHQL_ENDPOINT: ${{ secrets.VITE_GRAPHQL_ENDPOINT }}
      VITE_GITHUB_PERSONAL_ACCESS_TOKEN: ${{ secrets.VITE_GITHUB_PERSONAL_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Check Svelte and TypeScript
        run: pnpm run check
      - name: Run unit tests
        run: pnpm run test
      - name: Build and test Lambda@Edge adapter
        run: pnpm run build && pnpm run test:adapter

  website-e2e:
    name: Playwright end-to-end and accessibility tests
    timeout-minutes: 30
    needs: [website-test]
    runs-on: ubuntu-latest
    env:
      VITE_GRAPHQL_ENDPOINT: ${{ secrets.VITE_GRAPHQL_ENDPOINT }}
      VITE_GITHUB_PERSONAL_ACCESS_TOKEN: ${{ secrets.VITE_GITHUB_PERSONAL_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps
      - name: Run Playwright tests
        run: pnpm exec playwright test --forbid-only
      - name: Run axe accessibility tests
        run: pnpm run test:a11y
      - name: Install Pa11y and its browser
        run: npm install --global pa11y puppeteer
      - name: Build site for Pa11y
        run: pnpm run build
      - name: Start preview server
        run: |
          pnpm run preview -- --host 127.0.0.1 > /tmp/portfolio-preview.log 2>&1 &
          echo $! > /tmp/portfolio-preview.pid
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat /tmp/portfolio-preview.log
          exit 1
      - name: Run Pa11y WCAG 2.0 AA checks
        run: |
          pa11y --standard WCAG2AA --reporter cli http://127.0.0.1:4173/
          pa11y --standard WCAG2AA --reporter cli http://127.0.0.1:4173/experience/
          pa11y --standard WCAG2AA --reporter cli http://127.0.0.1:4173/project/
      - name: Upload Playwright diagnostics
        if: always()
        uses: actions/upload-artifact@v4.6.2
        with:
          name: playwright-diagnostics
          path: |
            playwright-report/
            test-results/
            /tmp/portfolio-preview.log
          if-no-files-found: ignore
          retention-days: 7
