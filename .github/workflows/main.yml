on:
  push:
    branches:
      - 'master'

jobs:
  website-test:
    env:
      VITE_GRAPHQL_ENDPOINT: ${{ secrets.VITE_GRAPHQL_ENDPOINT }}
      VITE_GITHUB_PERSONAL_ACCESS_TOKEN: ${{ secrets.VITE_GITHUB_PERSONAL_ACCESS_TOKEN }}
    name: 'unit Test'
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{matrix.os}}
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4.4.0
        with:
          node-version-file: .nvmrc
          cache: 'pnpm'
      - name: installing dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Playwright Browsers
        run: pnpm exec playwright install --with-deps
      - name: running unit test
        run: pnpm run test
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4.6.2
        with:
          name: playwright-report-${{ matrix.os }}
          path: playwright-report/
  deploy:
    env:
      VITE_GRAPHQL_ENDPOINT: ${{ secrets.VITE_GRAPHQL_ENDPOINT }}
      VITE_GITHUB_PERSONAL_ACCESS_TOKEN: ${{ secrets.VITE_GITHUB_PERSONAL_ACCESS_TOKEN }}
    name: 'Deploy Website with cdk to aws stack 🚀'
    strategy:
      matrix:
        os: [ubuntu-latest]
    runs-on: ${{matrix.os}}
    needs: [website-test]
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4.4.0
        with:
          node-version-file: .nvmrc
          cache: 'pnpm'
      - name: installing website dependencies
        run: pnpm install --frozen-lockfile
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4.1.0
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1
      - name: deploying website and infrastructure
        run: pnpm run build && pnpm run postbuild && cd ./build && ../node_modules/.bin/cdk deploy --require-approval never

  unlighthouse:
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - uses: actions/setup-node@v4.4.0
      - name: Install Dependencies
        run: npm install -g @unlighthouse/cli puppeteer
      - name: Unlighthouse assertions and client
        run: unlighthouse-ci --site https://hufghani.dev --budget 95 --build-static --reporter
          jsonExpanded
